# 한국 서울(asia-northeast3) Google Cloud Run 에 배포하고, 서울에서 네이버 항공권 API 가 응답하는지 바로 확인한다.
# 필요한 GitHub 비밀값: GCP_SA_KEY(서비스 계정 키 JSON 전체), GCP_PROJECT_ID(프로젝트 ID)
name: 서울 서버 배포
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/**, package.json, package-lock.json, Dockerfile, .github/workflows/deploy-seoul.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 비밀값 확인 (값은 출력하지 않음)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for n in GCP_SA_KEY GCP_PROJECT_ID; do if [ -n "${!n}" ]; then echo "$n: 설정됨"; else echo "$n: 없음"; fi; done
          if [ -z "$GCP_SA_KEY" ] || [ -z "$GCP_PROJECT_ID" ]; then echo "비밀값이 없어 배포를 건너뜁니다."; exit 0; fi
          echo "READY=1" >> "$GITHUB_ENV"
      - if: env.READY == '1'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: env.READY == '1'
        uses: google-github-actions/setup-gcloud@v2
      - name: Cloud Run 서울에 배포
        if: env.READY == '1'
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet
          gcloud run deploy naver-flight-mcp --source . --region asia-northeast3 --allow-unauthenticated \
            --memory 512Mi --cpu 1 --min-instances 0 --max-instances 2 --timeout 120 --quiet
          URL=$(gcloud run services describe naver-flight-mcp --region asia-northeast3 --format 'value(status.url)')
          echo "서버 주소: $URL"
          echo "MCP 주소: $URL/mcp"
          echo "URL=$URL" >> "$GITHUB_ENV"
      - name: 서울에서 네이버 항공권 API 응답 확인
        if: env.READY == '1'
        run: |
          curl -s "$URL/health"; echo
          curl -s --max-time 110 "$URL/check"; echo
